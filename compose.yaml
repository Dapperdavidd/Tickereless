services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickerless
      POSTGRES_USER: tickerless
      POSTGRES_PASSWORD: tickerless
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickerless -d tickerless"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - tickerless-postgres:/var/lib/postgresql/data

volumes:
  tickerless-postgres:
