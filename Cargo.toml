[workspace]
members = ["crates/tickerless-api"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
actix-web = "4.15.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "json", "rustls"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring-native-roots", "uuid"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["net"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = "symbols"
